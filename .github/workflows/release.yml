name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: 'https://github.com/electron/electron/releases/download/'
      ELECTRON_BUILDER_BINARIES_MIRROR: 'https://github.com/electron-userland/electron-builder-binaries/releases/download/'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use upstream Electron mirror in CI
        run: npm config delete electron_mirror --location=project

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package app (unpacked)
        run: npx electron-builder --win --dir --config.directories.output=release-build --publish never

      - name: Add safe launcher
        shell: pwsh
        run: |
          $app = 'release-build/win-unpacked'
          if (Test-Path "$app/SkillTree-app.exe") { Remove-Item "$app/SkillTree-app.exe" -Force }
          Move-Item "$app/SkillTree.exe" "$app/SkillTree-app.exe" -Force
          Copy-Item 'build/launcher.exe' "$app/SkillTree.exe" -Force
          Get-ChildItem "$app/SkillTree*.exe" | Select-Object Name,Length

      - name: Build NSIS installer
        id: nsis
        continue-on-error: true
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --prepackaged release-build/win-unpacked --config.directories.output=release --publish never *>&1 | Tee-Object -FilePath nsis-build.log
          $code = $LASTEXITCODE
          Get-Content nsis-build.log | Write-Host
          exit $code

      - name: Upload NSIS log on failure
        if: steps.nsis.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $branch = "ci-log-${{ github.run_id }}"
          $file = "ci-nsis-${{ github.run_id }}.txt"
          if (-not (Test-Path nsis-build.log)) { Set-Content nsis-build.log 'no nsis log captured' }
          Copy-Item nsis-build.log $file -Force
          git checkout -B $branch
          git add -f $file
          git commit -m "CI NSIS log ${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin "HEAD:refs/heads/$branch"

      - name: Package portable ZIP and checksums
        id: portable
        if: steps.nsis.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          python scripts/make-portable-zip.py 'release/win-unpacked' "release/SkillTree-$version-portable.zip" 'docs/启动说明.txt' *>&1 | Tee-Object -FilePath zip-build.log
          $code = $LASTEXITCODE
          Get-Content zip-build.log | Write-Host
          if ($code -ne 0) { exit $code }

          $setup = Get-FileHash "release/SkillTree-$version-Setup.exe" -Algorithm SHA256
          $zip = Get-FileHash "release/SkillTree-$version-portable.zip" -Algorithm SHA256
          @(
            "个人技能树 v$version",
            "",
            "$($setup.Hash)  SkillTree-$version-Setup.exe",
            "$($zip.Hash)  SkillTree-$version-portable.zip"
          ) | Set-Content 'release/SHA256SUMS.txt' -Encoding utf8

          Get-ChildItem release | Format-Table Name,Length

      - name: Upload portable ZIP log on failure
        if: steps.portable.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $branch = "ci-zip-log-${{ github.run_id }}"
          $file = "ci-zip-${{ github.run_id }}.txt"
          if (-not (Test-Path zip-build.log)) { Set-Content zip-build.log 'no zip log captured' }
          Copy-Item zip-build.log $file -Force
          git checkout -B $branch
          git add -f $file
          git commit -m "CI portable ZIP log ${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin "HEAD:refs/heads/$branch"

      - name: Publish GitHub Release
        if: steps.nsis.outcome == 'success' && steps.portable.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 个人技能树 ${{ github.ref_name }}
          body: |
            Windows 10 / 11（x64）

            - **SkillTree-1.0.0-Setup.exe**：一键安装版，按当前用户安装，不需要管理员权限，装完自动启动。
            - **SkillTree-1.0.0-portable.zip**：免安装版，完整解压后双击 `SkillTree\SkillTree.exe`。

            首次启动如果系统限制 Chromium 沙箱或 GPU，启动器会自动切兼容模式；
            如果“我的文档”不可写，数据会自动放到程序目录下的 `我的技能树`。
            安装包未签名，SmartScreen 提示时选择“更多信息 → 仍要运行”。

            SHA256 校验值见 `SHA256SUMS.txt`。
          files: |
            release/SkillTree-*-Setup.exe
            release/SkillTree-*-portable.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
